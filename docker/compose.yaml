name: xr_teleoperate_all_in_one

services:
  xr:
    image: xr-teleoperate-all-in-one:isaac5.1
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    init: true
    network_mode: host
    gpus: all
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    stdin_open: true
    tty: true
    # Same video/USB device permissions as the existing Docker launcher.
    # Actual camera paths are mounted only when starting the image server.
    device_cgroup_rules:
      - 'c 81:* rmw'
      - 'c 189:* rmw'
    environment:
      IMG_SERVER_IP: ${IMG_SERVER_IP:-127.0.0.1}
      NETWORK_INTERFACE: ${NETWORK_INTERFACE:-}
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/nvidia_icd.json
    volumes:
      - isaac-cache:/root/.cache
      - type: bind
        source: ../xr_teleoperate
        target: /opt/src/xr_teleoperate
        bind:
          create_host_path: false
      - type: bind
        source: ../unitree_sim_isaaclab/robots
        target: /opt/src/unitree_sim_isaaclab/robots
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../unitree_sim_isaaclab/tasks
        target: /opt/src/unitree_sim_isaaclab/tasks
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../unitree_sim_isaaclab/dds
        target: /opt/src/unitree_sim_isaaclab/dds
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../unitree_sim_isaaclab/action_provider
        target: /opt/src/unitree_sim_isaaclab/action_provider
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../unitree_sim_isaaclab/sim_main.py
        target: /opt/src/unitree_sim_isaaclab/sim_main.py
        read_only: true
        bind:
          create_host_path: false
      - ../data:/opt/src/xr_teleoperate/teleop/utils/data
      - type: bind
        source: /etc/vulkan/icd.d
        target: /etc/vulkan/icd.d
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /usr/share/vulkan/icd.d
        target: /usr/share/vulkan/icd.d
        read_only: true
        bind:
          create_host_path: false
    command: [shell]

  # Use the same built image on a camera PC without requiring an NVIDIA GPU.
  image-server:
    image: xr-teleoperate-all-in-one:isaac5.1
    platform: linux/amd64
    init: true
    network_mode: host
    stdin_open: true
    tty: true
    device_cgroup_rules:
      - 'c 81:* rmw'
      - 'c 189:* rmw'
    command: [image-server]

volumes:
  isaac-cache:
